server {
    listen 443 ssl;
    server_name 118.25.103.107;

    ssl_certificate /etc/letsencrypt/live/118.25.103.107/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/118.25.103.107/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=86400" always;

    location = /phone-mic {
        proxy_pass http://127.0.0.1:43822;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    location = /phone-mic/ticket {
        proxy_pass http://127.0.0.1:43822;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    location = /phone-mic/ws {
        proxy_pass http://127.0.0.1:43822;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / { return 404; }
}
