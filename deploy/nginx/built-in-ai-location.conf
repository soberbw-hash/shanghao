# Include inside the HTTPS server block. The app authenticates each paid request.
# Keep audio and recording text out of nginx request-body temporary files.
location ^~ /api/ai/ {
    client_max_body_size 13m;
    client_body_timeout 20s;
    proxy_pass http://127.0.0.1:43821;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 190s;
    proxy_send_timeout 190s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
}
