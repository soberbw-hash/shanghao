<title>上号｜开黑房</title>
<style>
:root{
  --ink:#0b1220;
  --muted:#6e7889;
  --quiet:#969eaa;
  --blue:#1677ff;
  --blue-hover:#0669ef;
  --soft:#f5f5f7;
  --line:#e7e9ee;
  --font:"PingFang SC","SF Pro Display","Segoe UI Variable","Noto Sans SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);background:#fff;font-family:var(--font);font-synthesis:none;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.shell{width:min(1180px,calc(100% - 64px));margin-inline:auto}

/* NAV */
.site-nav{
  position:sticky;top:0;z-index:30;
  background:rgba(255,255,255,.86);
  backdrop-filter:blur(18px) saturate(150%);
  border-bottom:1px solid rgba(15,23,42,.06);
}
.nav-inner{height:58px;display:flex;align-items:center;gap:30px}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand img{width:31px;height:31px;border-radius:8px}
.brand-text{display:grid;line-height:1}
.brand-text small{font-size:7px;letter-spacing:.22em;color:#8c98aa;font-weight:700}
.brand-text strong{margin-top:4px;font-size:13px;letter-spacing:.02em}
.nav-links{margin-left:auto;display:flex;align-items:center;gap:25px}
.nav-links a{font-size:12px;color:#697386;transition:.18s}
.nav-links a:hover{color:#111827}
.nav-download{
  min-height:37px;padding:0 16px;border-radius:11px;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--blue);color:#fff!important;font-weight:650!important;
}
.nav-download:hover{background:var(--blue-hover)!important;color:#fff!important}

/* HERO */
.hero{padding:104px 0 124px;text-align:center;overflow:hidden}
.hero-label{font-size:13px;font-weight:650;color:var(--blue);margin-bottom:22px}
.hero h1{
  margin:0 auto;
  font-size:clamp(72px,7.3vw,106px);
  line-height:1;
  letter-spacing:-.038em;
  font-weight:730;
  white-space:nowrap;
}
.hero-lede{
  margin:30px auto 0;
  color:var(--muted);
  font-size:clamp(18px,1.8vw,22px);
  line-height:1.6;
}
.hero-actions{margin-top:34px;display:flex;justify-content:center;align-items:center;gap:14px}
.btn{
  min-height:48px;padding:0 22px;border-radius:14px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:650;transition:.18s;
}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 9px 24px rgba(22,119,255,.18)}
.btn-primary:hover{background:var(--blue-hover);transform:translateY(-1px)}
.text-link{font-size:14px;font-weight:620;color:var(--blue)}
.hero-note{margin-top:18px;color:var(--quiet);font-size:12px}
.hero-stage{
  margin:62px auto 0;
  padding:14px;
  border-radius:35px;
  background:linear-gradient(180deg,#f8fbff 0%,#edf5ff 100%);
  border:1px solid #e7edf5;
}
.hero-stage img{
  width:100%;
  border-radius:23px;
  box-shadow:0 32px 86px rgba(31,59,101,.13);
}

/* STORY */
.story{padding:162px 0;overflow:hidden}
.story.soft{background:var(--soft)}
.story-grid{
  display:grid;
  grid-template-columns:minmax(0,.78fr) minmax(0,1.22fr);
  align-items:center;
  gap:110px;
}
.story.reverse{grid-template-columns:minmax(0,1.06fr) minmax(0,.94fr)}
.story.reverse .copy{order:2}
.story.reverse .visual{order:1}
.copy{max-width:560px}
.eyebrow{
  margin-bottom:17px;
  color:#86868b;
  font-size:12px;
  font-weight:630;
}
.copy h2{
  margin:0;
  width:max-content;
  max-width:100%;
  font-size:clamp(40px,3vw,52px);
  line-height:1.07;
  letter-spacing:-.028em;
  font-weight:710;
  white-space:nowrap;
}
.copy p{
  margin:21px 0 0;
  color:var(--muted);
  font-size:17px;
  line-height:1.72;
}
.meta{margin-top:15px;color:#929aa7;font-size:11px}
.visual{
  padding:10px;
  border:1px solid #e5e9ef;
  border-radius:30px;
  background:#fff;
  box-shadow:0 30px 84px rgba(34,54,84,.09);
}
.visual img{width:100%;border-radius:20px}
.visual.focus{width:min(100%,580px);justify-self:start;padding:14px}
.visual.focus img{border-radius:22px}
.history .copy{max-width:660px}
.history .copy h2{font-size:clamp(40px,3.55vw,52px)}

/* CTA */
.final{padding:150px 0 138px;text-align:center}
.final h2{
  margin:0 auto;
  font-size:clamp(60px,6vw,86px);
  line-height:1;
  letter-spacing:-.035em;
  font-weight:725;
  white-space:nowrap;
}
.final p{margin:25px 0 0;color:var(--quiet);font-size:12px}
.final .hero-actions{margin-top:32px}

/* FOOTER */
.footer{border-top:1px solid #edf0f3}
.footer-inner{min-height:96px;display:flex;align-items:center;gap:28px;color:#8c95a3;font-size:11px}
.footer-inner .brand{opacity:.72}
.footer-links{margin-left:auto;display:flex;gap:22px}
.footer-links a:hover{color:#111827}

/* subtle reveal */
.reveal{opacity:0;transform:translateY(16px);transition:opacity .65s cubic-bezier(.2,.7,.2,1),transform .65s cubic-bezier(.2,.7,.2,1)}
.reveal.show{opacity:1;transform:none}

@media (max-width:960px){
  .shell{width:min(100% - 38px,1180px)}
  .hero{padding:88px 0 108px}
  .hero h1{font-size:clamp(58px,9vw,78px)}
  .hero-stage{margin-top:54px}
  .story{padding:122px 0}
  .story-grid,.story.reverse{grid-template-columns:1fr;gap:52px}
  .story.reverse .copy,.story.reverse .visual{order:initial}
  .copy,.history .copy{max-width:760px;margin:auto;text-align:center}
  .copy h2{margin-inline:auto}
  .copy p{max-width:650px;margin-left:auto;margin-right:auto}
  .visual,.visual.focus{width:min(100%,820px);justify-self:center}
  .history .copy h2{font-size:clamp(40px,6vw,56px)}
}

@media (max-width:680px){
  .shell{width:min(100% - 28px,1180px)}
  .nav-links>a:not(.nav-download){display:none}
  .hero{padding:68px 0 84px}
  .hero-label{margin-bottom:16px}
  .hero h1{
    font-size:clamp(48px,14vw,62px);
    white-space:normal;
    text-wrap:balance;
  }
  .hero-lede{margin-top:22px;font-size:16px}
  .hero-actions{margin-top:26px;flex-direction:column;gap:13px}
  .btn{width:min(100%,280px)}
  .hero-stage{margin-top:44px;padding:8px;border-radius:23px}
  .hero-stage img{border-radius:17px}
  .story{padding:88px 0}
  .story-grid{gap:38px}
  .copy h2,.history .copy h2{
    width:auto;
    font-size:clamp(39px,10.5vw,50px);
    white-space:normal;
    text-wrap:balance;
  }
  .copy p{margin-top:20px;font-size:15px}
  .visual,.visual.focus{padding:8px;border-radius:22px}
  .visual img,.visual.focus img{border-radius:15px}
  .final{padding:112px 0 106px}
  .final h2{
    font-size:clamp(46px,12vw,58px);
    white-space:normal;
    text-wrap:balance;
  }
  .footer-inner{min-height:110px;align-items:flex-start;flex-direction:column;padding:24px 0}
  .footer-links{margin-left:0}
}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .reveal{opacity:1;transform:none;transition:none}
}

/* v9 final polish */
.hero-label{color:#7f8794;font-weight:620}
.hero h1,.copy h2,.final h2{font-kerning:normal}
.copy p{max-width:460px}
.story.soft{background:#f6f6f8}
.visual{box-shadow:0 24px 68px rgba(34,54,84,.075)}
#ai .visual img{aspect-ratio:auto;object-fit:cover;object-position:top}
#ai .visual{padding:10px}
@media(max-width:960px){
  .hero{padding:78px 0 94px}
  .story{padding:108px 0}
  .final{padding:104px 0 96px}
}
@media(max-width:680px){
  .hero{padding:62px 0 72px}
  .story{padding:78px 0}
  .final{padding:92px 0 86px}
}

/* ===== v10 截图严格等比显示 ===== */
.hero-stage,
.visual,
.visual.focus{
  height:auto !important;
  min-height:0 !important;
  align-self:center !important;
}

.hero-stage img,
.visual img,
.visual.focus img,
#ai .visual img{
  display:block !important;
  width:100% !important;
  height:auto !important;
  max-width:100% !important;
  max-height:none !important;
  aspect-ratio:auto !important;
  object-fit:contain !important;
  object-position:center !important;
  flex:none !important;
}

/* 不让 Grid 把图片区域纵向拉满 */
.story-grid{
  align-items:center !important;
}

.visual,
.visual.focus{
  overflow:hidden;
}

/* 房间记录本身是偏方形裁切，限制宽度但绝不改比例 */
.history .visual.focus{
  width:min(100%,560px) !important;
}

/* AI 截图只按原图比例展示，不再 cover 裁撑 */
#ai .visual img{
  object-fit:contain !important;
  object-position:top center !important;
}

/* 手机和平板同样保持原图比例 */
@media(max-width:960px){
  .hero-stage img,
  .visual img,
  .visual.focus img,
  #ai .visual img{
    width:100% !important;
    height:auto !important;
  }
}

/* 房间记录标题较长：桌面端给文案和截图等宽空间，避免被截图遮住。 */
@media(min-width:961px){
  .history .story-grid{
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:64px;
  }
  .history .copy{max-width:none}
  .history .copy h2{
    width:100%;
    font-size:clamp(38px,3vw,47px);
  }
}
</style>

<script>
const items = document.querySelectorAll('.reveal');
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('show');
        io.unobserve(entry.target);
      }
    });
  }, {threshold:.08});
  items.forEach(el => io.observe(el));
} else {
  items.forEach(el => el.classList.add('show'));
}
</script>
