<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">ShangHao 3.0 Core 与平台边界</title>
  <desc id="desc">React 通过 Typed DesktopApi 访问 Electron Host，再分流到 PlatformService 或 Rust Core JSONL。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6685a7"/></marker>
    <style>
      .box{fill:#f8fbff;stroke:#b9cde3;stroke-width:2}.core{fill:#edf5ff;stroke:#6da5e8}.native{fill:#f7f1ff;stroke:#b598dd}.label{font:600 22px "Segoe UI","Microsoft YaHei",sans-serif;fill:#243b59}.small{font:16px "Segoe UI","Microsoft YaHei",sans-serif;fill:#637b98}.line{stroke:#6685a7;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="560" rx="24" fill="#ffffff"/>
  <text x="48" y="58" class="label" font-size="30">3.0 Core 与平台边界</text>
  <text x="48" y="88" class="small">Renderer 使用窄而明确的能力接口，不暴露万能 IPC；平台能力与 Rust Core 各自守住职责边界。</text>
  <rect x="46" y="220" width="230" height="92" rx="16" class="box"/>
  <text x="161" y="258" text-anchor="middle" class="label">React</text><text x="161" y="286" text-anchor="middle" class="small">shanghaoCore.*</text>
  <rect x="342" y="220" width="230" height="92" rx="16" class="box core"/>
  <text x="457" y="258" text-anchor="middle" class="label">Typed DesktopApi</text><text x="457" y="286" text-anchor="middle" class="small">固定输入 / 返回 / 错误边界</text>
  <rect x="638" y="220" width="230" height="92" rx="16" class="box core"/>
  <text x="753" y="258" text-anchor="middle" class="label">Electron Host</text><text x="753" y="286" text-anchor="middle" class="small">Preload / IPC / 窗口</text>
  <rect x="970" y="130" width="190" height="78" rx="16" class="box"/>
  <text x="1065" y="164" text-anchor="middle" class="label">PlatformService</text><text x="1065" y="190" text-anchor="middle" class="small">平台能力</text>
  <rect x="970" y="260" width="190" height="78" rx="16" class="box"/>
  <text x="1065" y="294" text-anchor="middle" class="label">ScreenCaptureService</text><text x="1065" y="320" text-anchor="middle" class="small">采集 / 来源 / 保护</text>
  <rect x="970" y="390" width="190" height="78" rx="16" class="box native"/>
  <text x="1065" y="424" text-anchor="middle" class="label">Rust Core JSONL</text><text x="1065" y="450" text-anchor="middle" class="small">受控本地能力</text>
  <rect x="700" y="420" width="190" height="78" rx="16" class="box native"/>
  <text x="795" y="454" text-anchor="middle" class="label">Win32 Activity</text><text x="795" y="480" text-anchor="middle" class="small">前台活动识别</text>
  <rect x="430" y="420" width="190" height="78" rx="16" class="box native"/>
  <text x="525" y="454" text-anchor="middle" class="label">Stable File Identity</text><text x="525" y="480" text-anchor="middle" class="small">稳定文件身份</text>
  <rect x="160" y="420" width="190" height="78" rx="16" class="box native"/>
  <text x="255" y="454" text-anchor="middle" class="label">AI Process Supervisor</text><text x="255" y="480" text-anchor="middle" class="small">模型进程托管</text>
  <path d="M276 266H342" class="line"/><path d="M572 266H638" class="line"/><path d="M868 244L970 169" class="line"/><path d="M868 266H970" class="line"/><path d="M868 288L970 429" class="line"/><path d="M970 429L890 459" class="line"/><path d="M970 429L620 459" class="line"/><path d="M970 429L350 459" class="line"/>
</svg>
