appId: com.sober.shanghao
productName: "上号"
protocols:
  - name: "上号房间邀请"
    schemes:
      - shanghao
publish:
  provider: github
  owner: soberbw-hash
  repo: shanghao
generateUpdatesFilesForAllChannels: true
asar: true
npmRebuild: false
asarUnpack:
afterPack: scripts/after-pack.cjs
directories:
  output: release
  buildResources: build
files:
  - "dist/**"
  - "dist-electron/**"
  - "!dist/**/*.map"
  - "!dist-electron/**/*.map"
  - "!dist-electron/tests/**"
  - "!node_modules/**/*.map"
  # The runnable binary is copied once to resources/ffmpeg below. Keep the
  # ffmpeg-static JS resolver for development without packaging its second exe.
  - "!node_modules/ffmpeg-static/ffmpeg.exe"
  # Vite has already bundled these renderer-only libraries and font subsets
  # into dist/. Their raw package trees are unused by Electron's main process.
  - "!node_modules/react/**"
  - "!node_modules/react-dom/**"
  - "!node_modules/framer-motion/**"
  - "!node_modules/gsap/**"
  - "!node_modules/lucide/**"
  - "!node_modules/lucide-react/**"
  - "!node_modules/morphicons/**"
  - "!node_modules/uisfx/**"
  - "!node_modules/@fontsource-variable/**"
  - "!node_modules/react-virtuoso/**"
  - "!node_modules/zustand/**"
  # Only win32-x64 is shipped. Keep its uiohook addon for mouse shortcuts.
  - "!node_modules/uiohook-napi/prebuilds/win32-arm64/**"
  - "!node_modules/uiohook-napi/prebuilds/darwin-arm64/**"
  - "!node_modules/uiohook-napi/prebuilds/darwin-x64/**"
  - "!node_modules/uiohook-napi/prebuilds/linux-arm64/**"
  - "!node_modules/uiohook-napi/prebuilds/linux-loong64/**"
  - "!node_modules/uiohook-napi/prebuilds/linux-x64/**"
  # Workspace packages enter via their dist/ entrypoints; their TypeScript
  # source is not needed at runtime.
  - "!node_modules/@private-voice/*/src/**"
  # The main process resolves CloudBase's node CJS export; its mini-program
  # distribution is a separate platform build.
  - "!node_modules/@cloudbase/js-sdk/miniprogram_dist/**"
  - "package.json"
extraResources:
  - from: node_modules/ffmpeg-static/ffmpeg.exe
    to: ffmpeg/ffmpeg.exe
  - from: ../../THIRD_PARTY_NOTICES.md
    to: licenses/THIRD_PARTY_NOTICES.md
  - from: node_modules/deepfilternet3-noise-filter/LICENSE-APACHE
    to: licenses/deepfilternet3-noise-filter-APACHE-2.0.txt
  - from: node_modules/@fontsource-variable/noto-sans-sc/LICENSE
    to: licenses/NotoSansSC-OFL-1.1.txt
  - from: resources/deepfilter
    to: deepfilter
    filter:
      - "df_bg.wasm"
      - "DeepFilterNet3_onnx.tar.gz"
  - from: resources/ai/runtime-manifest.json
    to: ai/runtime-manifest.json
  - from: resources/quick-messages
    to: quick-messages
  - from: resources/native
    to: native
    filter:
      - "shanghao-core.exe"
      - "ShangHao.PhoneAudio.exe"
  - from: scripts/qwen-runner.py
    to: ai/qwen-runner.py
  - from: scripts/asr-runner.py
    to: ai/asr-runner.py
  - from: build
    to: build
    filter:
      - "shanghao-icon-v4.ico"
      - "shanghao-shortcut-v4.ico"
      - "icon.png"
      # Preserve the approved original in every installed version.
      - "icon-master.png"
      - "brand-source.json"
extraMetadata:
  name: shanghao
  main: dist-electron/main/index.cjs

win:
  executableName: ShangHao
  icon: shanghao-icon-v4.ico
  artifactName: ShangHao-${version}-Setup-${arch}.${ext}
  electronLanguages:
    - zh-CN
    - en-US
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: true
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  shortcutName: "上号"
  installerIcon: shanghao-icon-v4.ico
  uninstallerIcon: shanghao-icon-v4.ico
  installerHeaderIcon: shanghao-icon-v4.ico
