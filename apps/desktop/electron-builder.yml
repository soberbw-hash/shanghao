appId: com.sober.shanghao
productName: "上号"
protocols:
  - name: "上号房间邀请"
    schemes:
      - shanghao
publish:
  provider: github
  owner: soberbw-hash
  repo: shanghao
generateUpdatesFilesForAllChannels: true
asar: true
npmRebuild: false
asarUnpack:
afterPack: scripts/after-pack.cjs
directories:
  output: release
  buildResources: build
files:
  - "dist/**"
  - "dist-electron/**"
  - "!dist/**/*.map"
  - "!dist-electron/**/*.map"
  - "!dist-electron/tests/**"
  - "!node_modules/**/*.map"
  - "package.json"
extraResources:
  - from: ../../THIRD_PARTY_NOTICES.md
    to: licenses/THIRD_PARTY_NOTICES.md
  - from: node_modules/deepfilternet3-noise-filter/LICENSE-APACHE
    to: licenses/deepfilternet3-noise-filter-APACHE-2.0.txt
  - from: node_modules/@fontsource-variable/noto-sans-sc/LICENSE
    to: licenses/NotoSansSC-OFL-1.1.txt
  - from: resources/deepfilter
    to: deepfilter
    filter:
      - "df_bg.wasm"
      - "DeepFilterNet3_onnx.tar.gz"
  - from: build
    to: build
    filter:
      - "shanghao-icon-v3.ico"
      - "shanghao-shortcut-v3.ico"
      - "tray-dark.png"
      - "tray-light.png"
extraMetadata:
  name: shanghao
  main: dist-electron/main/index.cjs

win:
  executableName: ShangHao
  icon: shanghao-icon-v3.ico
  artifactName: ShangHao-${version}-Setup-${arch}.${ext}
  electronLanguages:
    - zh-CN
    - en-US
  requestedExecutionLevel: requireAdministrator
  signAndEditExecutable: true
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  shortcutName: "上号"
  installerIcon: shanghao-icon-v3.ico
  uninstallerIcon: shanghao-icon-v3.ico
  installerHeaderIcon: shanghao-icon-v3.ico
