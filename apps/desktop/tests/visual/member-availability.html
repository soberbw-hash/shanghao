<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      window.desktopApi = { app: { writeLog: async () => {} } };
      const phoneListeners = new Set();
      window.phoneFixture = {
        calls: [],
        configureCalls: 0,
        emit(active) {
          for (const callback of phoneListeners) callback({ active, busy: false });
        },
      };
      window.desktopApi.phoneMode = {
        get: async () => ({ active: false, busy: false }),
        set: async (active) => {
          window.phoneFixture.calls.push(active);
          window.phoneFixture.emit(active);
          await new Promise((resolve) => setTimeout(resolve, 120));
          return { active, busy: false };
        },
        devices: async () => {},
        configure: async () => {
          window.phoneFixture.configureCalls++;
        },
        onChanged: (callback) => {
          phoneListeners.add(callback);
          return () => phoneListeners.delete(callback);
        },
      };
    </script>
    <script type="module">
      import { injectIntoGlobalHook } from "/@react-refresh";
      injectIntoGlobalHook(window);
      window.$RefreshReg$ = () => {};
      window.$RefreshSig$ = () => (type) => type;
    </script>
    <script type="module" src="/@vite/client"></script>
    <meta charset="UTF-8" />
    <title>Member availability regression fixture</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./member-availability.fixture.tsx"></script>
  </body>
</html>
