name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要重新构建并覆盖的 Release 标签，例如 v3.0.6"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: windows-${{ inputs.release_tag || github.ref_name }}
    runs-on: windows-latest
    env:
      VITE_CLOUDBASE_ENV_ID: ${{ vars.VITE_CLOUDBASE_ENV_ID }}
      VITE_CLOUDBASE_REGION: ${{ vars.VITE_CLOUDBASE_REGION }}
      VITE_CLOUDBASE_PUBLISHABLE_KEY: ${{ vars.VITE_CLOUDBASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: node scripts/check-architecture-ratchet.mjs
        env:
          ARCHITECTURE_BASE: HEAD^
      - run: pnpm install --frozen-lockfile
      - shell: bash
        run: bash -n scripts/deploy-relay-ubuntu.sh
      - shell: bash
        run: bash -n deploy/install-phone-mic-sidecar.sh
      - run: pnpm release:verify -- ${{ inputs.release_tag || github.ref_name }}
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec tsc -p tools/asset-review/tsconfig.json --noEmit
      - run: cargo fmt --manifest-path native/Cargo.toml --all -- --check
      - run: pnpm test:native
      - run: pnpm test
      - run: pnpm test:phone-mic
      - run: pnpm test:migration
      - run: pnpm test:upgrade
      - run: pnpm test:runtime-health
      - run: pnpm test:audio-worklet
      - run: pnpm test:temporary-room
      - run: pnpm test:screen-capture
      - run: pnpm test:five-peer-audio
      - run: pnpm test:five-peer-media
      - run: pnpm build
      - run: pnpm dist:win
      - run: pnpm release:verify-package
      - run: pnpm --dir apps/desktop exec electron ../../tools/asset-review/verify.cjs
        env:
          ASSET_STUDIO_TEST_ROOT: ${{ github.workspace }}/apps/desktop/release/win-unpacked/resources/asset-studio
      - run: pnpm --dir apps/desktop exec electron ../../tools/asset-review/verify.cjs
        env:
          ASSET_STUDIO_TEST_ROOT: ${{ github.workspace }}/apps/desktop/release/win-unpacked/resources/asset-studio
          ASSET_STUDIO_TEST_ENTRY: "1"
      - run: node scripts/report-package-size.mjs --output=apps/desktop/release/package-size.json
      - run: node scripts/check-package-size.mjs apps/desktop/release/package-size.json docs/package-size-baseline-v3.2.2.json --enforce --size-advisory
      - name: Create versioned Windows ZIP
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          Compress-Archive -Path apps/desktop/release/win-unpacked/* -DestinationPath "apps/desktop/release/ShangHao-$version-Windows-x64.zip" -CompressionLevel Optimal
      - name: Prepare illustrated release body
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $body = Get-Content "docs/release-notes/$env:RELEASE_TAG.md" -Raw
          $assetBase = "https://github.com/soberbw-hash/shanghao/releases/download/$env:RELEASE_TAG"
          $body = [regex]::Replace($body, '\]\(\.\./assets/releases/[^/]+/([^)]+)\)', "]($assetBase/`$1)")
          New-Item -ItemType Directory -Path apps/desktop/release/screenshots -Force | Out-Null
          if (Test-Path "docs/assets/releases/$env:RELEASE_TAG") {
            Get-ChildItem "docs/assets/releases/$env:RELEASE_TAG" -Filter *.png -File | Copy-Item -Destination apps/desktop/release/screenshots
          }
          Set-Content apps/desktop/release/release-body.md -Value $body -Encoding utf8
      - run: pnpm release:checksums
      # Publish from the verified build job. Release assets do not need an
      # intermediate copy in the account's limited Actions artifact storage.
      - name: Publish verified release assets
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: 上号 ${{ inputs.release_tag || github.ref_name }}
          body_path: apps/desktop/release/release-body.md
          fail_on_unmatched_files: true
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
            apps/desktop/release/SHA256SUMS.txt
            apps/desktop/release/package-size.json
      - name: Publish release screenshots when provided
        if: ${{ hashFiles('apps/desktop/release/screenshots/*.png') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          fail_on_unmatched_files: true
          files: apps/desktop/release/screenshots/*.png
