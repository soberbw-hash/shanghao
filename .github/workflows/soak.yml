name: Realtime Long Session

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Bounded soak duration in minutes"
        required: false
        default: "15"

permissions:
  contents: read

jobs:
  realtime-soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Repeated five-peer audio and fault regression
        shell: bash
        env:
          SOAK_MINUTES: ${{ github.event.inputs.minutes || '15' }}
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/soak.log") 2>&1
          end=$((SECONDS + SOAK_MINUTES * 60))
          run=0
          while (( SECONDS < end )); do
            run=$((run + 1))
            echo "soak iteration $run"
            pnpm test:five-peer-audio
            pnpm --dir apps/desktop exec tsx --test tests/runtime-diagnostics.test.ts tests/network-adaptation.test.ts
            {
              echo "iteration=$run timestamp=$(date --iso-8601=seconds)"
              ps -eo pid,ppid,rss,comm --sort=-rss | head -n 30
            } >> "$GITHUB_WORKSPACE/process-samples.log"
          done
      - name: Final five-peer media regression
        run: xvfb-run -a pnpm test:five-peer-media
      - name: Upload soak diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: realtime-soak-${{ github.run_id }}
          path: |
            soak.log
            process-samples.log
          if-no-files-found: warn
