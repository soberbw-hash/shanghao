name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: node scripts/check-architecture-ratchet.mjs
        env:
          ARCHITECTURE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash -n scripts/deploy-relay-ubuntu.sh
      - run: bash -n deploy/install-phone-mic-sidecar.sh
      - run: pnpm typecheck
      - run: cargo fmt --manifest-path native/Cargo.toml --all -- --check
      - run: pnpm test:native
      - run: pnpm lint
      - run: xvfb-run -a pnpm test
      - run: pnpm test:phone-mic
      - run: pnpm test:migration
      - run: pnpm test:upgrade
      - run: pnpm test:runtime-health
      - run: xvfb-run -a pnpm --dir apps/desktop exec electron --no-sandbox tests/electron-audio-worklet-smoke.cjs
      - run: pnpm test:five-peer-audio
      - run: xvfb-run -a pnpm test:five-peer-media
      - run: pnpm build

  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: cargo fmt --manifest-path native/Cargo.toml --all -- --check
      - run: pnpm test:native
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:phone-mic
      - run: pnpm test:migration
      - run: pnpm test:upgrade
      - run: pnpm test:runtime-health
      - run: pnpm test:audio-worklet
      - run: pnpm test:screen-capture
      - run: pnpm test:five-peer-audio
      - run: pnpm test:five-peer-media
      - run: pnpm build
