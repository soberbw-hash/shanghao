name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash -n scripts/deploy-relay-ubuntu.sh
      - run: pnpm typecheck
      - run: cargo fmt --manifest-path native/Cargo.toml --all -- --check
      - run: pnpm test:native
      - run: pnpm lint
      - run: pnpm test
      - run: xvfb-run -a pnpm --dir apps/desktop exec electron --no-sandbox tests/electron-audio-worklet-smoke.cjs
      - run: pnpm test:five-peer-audio
      - run: xvfb-run -a pnpm test:five-peer-media
      - run: pnpm build
